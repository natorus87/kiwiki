<div class="content-inner subview">
  <nav class="breadcrumb" aria-label="{{ t.path_navigation }}">
    <button type="button" class="breadcrumb-item breadcrumb-root">Wiki</button>
    <span class="breadcrumb-sep" aria-hidden="true">/</span>
    <span class="breadcrumb-item current" aria-current="page">{{ t.search_history }}</span>
  </nav>
  <h1 class="subview-title">{{ t.last_searches }}</h1>
  {% if history %}
  <ul class="search-history-list">
    {% for h in history %}
    <li class="search-history-item">
      <a href="/?search={{ h.query|urlencode }}" class="kw-search-link" data-search-query="{{ h.query }}">
        {{ h.query }}
      </a>
      <span class="search-history-meta">{{ h.result_count }} {{ t.hits }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <div class="empty-state">
    <p>{{ t.no_searches }}</p>
  </div>
  {% endif %}
</div>
