<div class="content-inner">
  <h2>{{ t.history }}: {{ path }}</h2>
  {% if history %}
  <table class="history-table">
    <thead>
      <tr>
        <th>{{ t.date }}</th>
        <th>{{ t.author }}</th>
        <th>{{ t.message }}</th>
      </tr>
    </thead>
    <tbody>
      {% for h in history %}
      <tr>
        <td class="history-date">{{ h.date[:10] }}</td>
        <td>{{ h.author }}</td>
        <td>{{ h.message }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="empty-state">
    <p>{{ t.no_git_history }}</p>
  </div>
  {% endif %}
</div>
