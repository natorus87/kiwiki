{% if not results %}
  <p class="no-results" role="status">{{ t.no_results.format(query=query) }}</p>
{% else %}
  {% for result in results %}
    <a href="/?file={{ result.path|urlencode }}" class="search-result kw-file-link" data-file-path="{{ result.path }}">
      <span class="result-title">{{ result.title }}</span>
      <span class="result-path">{{ result.path }}</span>
      {% if result.snippet %}<span class="result-snippet">{{ result.snippet }}</span>{% endif %}
    </a>
  {% endfor %}
{% endif %}
