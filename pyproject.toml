[project]
name = "kiwiki"
version = "4.0.0"
description = "KI-gestütztes Wiki mit MCP-Server"
requires-python = ">=3.12,<3.14"
license = {text = "MIT"}

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = [
  "E501",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
# Reale Auslastung liegt bei 79 %. Das Gate steht bewusst darunter, damit es
# bei einem kleinen echten Verlust anschlaegt statt bei jeder Zeile.
fail_under = 75
show_missing = true
